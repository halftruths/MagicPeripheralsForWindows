<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Companion Settings</title>
<link rel="stylesheet" href="/common.css">
<style>
  /* In rows the backend is a colored dot (legend inline in the title row) so labels stay on one line. */
  .dot.windows { background: var(--b-windows); } .dot.companion { background: var(--b-companion); } .dot.driver { background: var(--b-driver); }
  .chevron .flag { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--b-driver); margin-left: 6px; vertical-align: 1px; }
  .chevron .flag.on { display: inline-block; }
  main { padding: 8px 20px 24px; display: grid; gap: 4px; }
  h2.sec { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 2px 8px; font-weight: 600; }
  .cards { display: grid; gap: 16px; align-items: start; }
  .cards.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cards.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards.c1 { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 1300px) { .cards.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 1100px) { .cards.c3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .cards.c4, .cards.c3 { grid-template-columns: minmax(0, 1fr); } }
  /* Fixed tile heights per section: the grid never reflows because of content. Tune here. */
  :root { --tile-h-gestures: 420px; --tile-h-click: 304px; --tile-h-scroll: 304px; --tile-h-other: 304px; }
  .cards.c4 { --tile-h: var(--tile-h-gestures); }
  .cards.c3 { --tile-h: var(--tile-h-click); }
  .cards.c1 { --tile-h: var(--tile-h-scroll); }
  .cards.other { --tile-h: var(--tile-h-other); }
  main { position: relative; z-index: 1; isolation: isolate; } /* raised cards stay below the fixed bars (z 50) and popover/toast */
  .slot { position: relative; height: var(--tile-h); }
  .slot > .card { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: clip;
                  transition: box-shadow .18s, border-color .18s; }
  .slot > .card.clipped { cursor: pointer; }
  .slot > .card.raised { height: auto; min-height: 100%; overflow: visible; cursor: default; border-color: var(--accent);
                         box-shadow: 0 14px 40px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.18); }
  .chead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
  .chead h2 { margin: 2px 0 8px; }
  button.collapse { display: none; padding: 1px 9px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .card.raised button.collapse { display: inline-block; }
  .foot { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 44px; padding: 0 14px 8px; align-items: flex-end;
          justify-content: flex-end; pointer-events: none; border-radius: 0 0 12px 12px;
          background: linear-gradient(to top, var(--panel) 38%, color-mix(in srgb, var(--panel) 0%, transparent)); }
  .card.clipped:not(.raised) .foot { display: flex; }
  .foot button { pointer-events: auto; padding: 2px 10px; font-size: 12px; color: var(--muted); border-radius: 999px; }
  .foot button:hover { color: var(--ink); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .slot > .card { transition: none; } }
  .card { padding: 12px 14px; }
  .card .sub { font-size: 12px; color: var(--muted); margin: -4px 0 6px; }
    .rows.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 28px; }
  @media (max-width: 1300px) { .rows.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .rows.grid { grid-template-columns: minmax(0, 1fr); } }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
  .rows:not(.grid) > .row:first-child { border-top: 0; }
  .row label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .row .name { display: flex; gap: 7px; align-items: baseline; }
  .row .name .dot { transform: translateY(-1px); }
  .row .help { font-size: 12px; color: var(--muted); }
  .row.changed .name::after { content: "\2022"; color: var(--accent); }
  .row.inactive label, .row.inactive .ctl { opacity: .4; }
  body.hide-help .help { display: none; }
  .row.pending { background: color-mix(in srgb, var(--b-driver) 8%, transparent); }
  .ctl { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .unit { font-size: 12px; color: var(--muted); max-width: 150px; text-align: right; }
  input[type=number] { width: 84px; padding: 5px 7px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
                       font: inherit; font-variant-numeric: tabular-nums; text-align: right; }
  select { padding: 5px 7px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; max-width: 210px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  button.reset { padding: 2px 7px; color: var(--muted); }
  button.primary { background: var(--b-driver); border-color: var(--b-driver); color: #fff; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .cards.c4b { grid-template-columns: repeat(4, minmax(0, 1fr)); --tile-h: var(--tile-h-click); }
  @media (max-width: 1300px) { .cards.c4b { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .cards.c4b { grid-template-columns: minmax(0, 1fr); } }
  .cards.short { --tile-h: 150px; }
  .pagehead h1 .suffix { color: var(--muted); font-weight: 400; }
  .row .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
  .devstrip { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 20px 0; }
  .chip { display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; color: var(--muted); background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px 8px 13px; margin: 1px; cursor: pointer; min-width: 190px; }
  .chip svg { flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .chip .nm { display: block; font-weight: 600; font-size: 13px; }
  .chip .st { display: block; font-size: 12px; color: var(--muted); }
  .chip[aria-checked=true] { border: 2px solid var(--ink); padding: 7px 13px 7px 12px; color: var(--ink); }
  .chip[aria-checked=true] .st { color: var(--ink); }
  .chip.off:not([aria-checked=true]) { opacity: .6; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .popover .legend span { display: flex; align-items: center; gap: 8px; }
  .popover label.chk { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
</style>
</head>
<body>
<div class="pagehead">
  <h1>Settings<span class="suffix" id="devtitle"> / Magic Trackpad</span></h1>
  <div class="rel keygroup">
    <div class="legend inline" aria-label="Setting types">
      <span><span class="dot windows"></span>Windows</span>
      <span><span class="dot companion"></span>Companion</span>
      <span><span class="dot driver"></span>Driver</span>
    </div>
    <button class="chevron" data-pop="morepop" aria-label="More options" aria-expanded="false" aria-haspopup="true"><span class="flag" id="keyflag"></span></button>
    <div class="popover" id="morepop">
      <h3>Setting types</h3>
      <div class="legend">
        <span><span class="dot windows"></span>Windows: applied instantly through Windows' touchpad settings</span>
        <span><span class="dot companion"></span>Companion: applied instantly by the companion while it runs</span>
        <span><span class="dot driver"></span>Driver: needs admin approval, then power-cycle the trackpad</span>
      </div>
      <h3>Status</h3>
      <div id="notes">Loading…</div>
      <h3>Display</h3>
      <label class="chk"><input type="checkbox" id="showHelp"> Show descriptions</label>
    </div>
  </div>
</div>
<div class="devstrip" id="devstrip" role="radiogroup" aria-label="Device"></div>
<main id="main"></main>
<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);
let schema = [], values = {}, pendingDriver = {};
const DEVICES = [
  { id: "trackpad", name: "Magic Trackpad",
    icon: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 15h18"/></svg>' },
  { id: "keyboard", name: "Magic Keyboard",
    icon: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>' },
];
let device = "trackpad";
const SECTIONS_BY_DEVICE = {
  trackpad: [
    { title: "Gestures", cls: "c4", groups: ["1 finger", "2 fingers", "3 fingers", "4 fingers"] },
    { title: "Click, taps, pointer & battery", cls: "c4b", groups: ["Click (driver)", "Taps", "Pointer", "Battery"] },
    { title: "Scrolling", cls: "c1", groups: ["Scrolling (companion engine)"], grid: true },
  ],
  keyboard: [
    { title: "Battery", cls: "c3 short", groups: ["Battery"] },
  ],
};
let SECTIONS = SECTIONS_BY_DEVICE.trackpad;
const GROUP_NOTES = { "Scrolling (companion engine)": "Used when 2-finger scrolling is handled by the companion engine." };
const current = key => key in pendingDriver ? pendingDriver[key] : values[key];
// A setting is active if its dependency (and that dependency's own dependency) holds.
function active(spec) {
  if (!spec.depends) return true;
  const [key, allowed] = spec.depends;
  const parent = schema.find(s => s.key === key);
  return allowed.includes(current(key)) && active(parent);
}
const showHelp = (() => { try { return localStorage.getItem("showHelp") === "1"; } catch { return false; } })();
$("showHelp").checked = showHelp;
document.body.classList.toggle("hide-help", !showHelp);
$("showHelp").onchange = e => {
  document.body.classList.toggle("hide-help", !e.target.checked);
  try { localStorage.setItem("showHelp", e.target.checked ? "1" : "0"); } catch {}
  layout();
};

const toast = msg => MC.toast(msg);

function fmt(spec, v) { return spec.kind === "float" ? Number(v).toFixed(spec.step < 1 ? (String(spec.step).split(".")[1] || "").length : 0) : v; }

function control(spec) {
  const v = current(spec.key);
  if (spec.kind === "bool") return `<input type="checkbox" data-key="${spec.key}" ${v ? "checked" : ""}>`;
  if (spec.kind === "choice") return `<select data-key="${spec.key}">${spec.choices.map(([val, label]) => `<option value="${val}" ${val === v ? "selected" : ""}>${label}</option>`).join("")}</select>`;
  return `<input type="number" data-key="${spec.key}" value="${fmt(spec, v)}" min="${spec.min ?? ""}" max="${spec.max ?? ""}" step="${spec.step ?? "any"}">`
       + (spec.unit ? `<span class="unit">${spec.unit}</span>` : "");
}

function cardHtml(g, grid) {
  const rows = schema.filter(s => s.group === g).map(s => {
    const cur = current(s.key);
    const changed = cur !== s.default;
    const why = active(s) ? "" : ` title="No effect with the current ${schema.find(x => x.key === s.depends[0]).label.toLowerCase()} setting"`;
    return `<div class="row ${changed ? "changed" : ""} ${s.key in pendingDriver ? "pending" : ""} ${active(s) ? "" : "inactive"}" data-row="${s.key}"${why}>
      <label><span class="name"><span class="dot ${s.backend}" title="${s.backend}"></span>${s.label}${s.device === "global" ? ' <span class="tag" title="Applies to every device, not just this one">system-wide</span>' : ""}</span>${s.help ? `<span class="help">${s.help}</span>` : ""}</label>
      <div class="ctl">${control(s)}</div>
      <button class="reset" data-reset="${s.key}" title="Reset to default (${s.kind === "choice" ? s.choices.find(c => c[0] === s.default)[1] : s.default})" ${changed ? "" : "disabled"}>↺</button>
    </div>`;
  }).join("");
  const driverBtn = schema.some(s => s.group === g && s.backend === "driver")
    ? `<div class="row"><span class="note">Driver changes need admin approval, then power-cycle the trackpad (button on its side).</span><span></span>
       <button class="primary" data-apply-driver ${Object.keys(pendingDriver).length ? "" : "disabled"}>Apply driver settings</button></div>` : "";
  return `<div class="slot" data-g="${g}"><section class="card"><div class="chead"><h2>${g}</h2><button class="collapse" data-collapse title="Collapse (Esc)">Collapse</button></div>${GROUP_NOTES[g] ? `<p class="sub">${GROUP_NOTES[g]}</p>` : ""}<div class="rows${grid ? " grid" : ""}">${rows}</div>${driverBtn}<div class="foot"><button data-showall>Show all</button></div></section></div>`;
}

function render() {
  const present = new Set(schema.map(s => s.group));
  const known = new Set(SECTIONS.flatMap(s => s.groups));
  const sections = [...SECTIONS, { title: "Other", cls: "c3", groups: [...present].filter(g => !known.has(g)) }];
  $("main").innerHTML = sections.map(sec => {
    const gs = sec.groups.filter(g => present.has(g));
    return gs.length ? `<div class="section"><h2 class="sec">${sec.title}</h2><div class="cards ${sec.cls}${sec.title === "Other" ? " other" : ""}">${gs.map(g => cardHtml(g, sec.grid)).join("")}</div></div>` : "";
  }).join("") + (device === "keyboard" ? '<p class="note">More keyboard settings coming: key remapping (Cmd/Option), function row.</p>' : "");
  updateNotes();
  layout();
}

// ---- Fixed-size tiles: clipped cards can be raised (overlap in place) to show everything. ----
let raised = []; // group names, last = top-most; survives render()
const FOOT = 34;
function layout() {
  const now = [];
  document.querySelectorAll(".slot").forEach(slot => {
    const card = slot.firstElementChild, g = slot.dataset.g;
    const slotH = slot.clientHeight;
    const over = card.scrollHeight > slotH + 1;
    const cardTop = card.getBoundingClientRect().top;
    const hidden = [...card.querySelectorAll(".row")].filter(r => r.getBoundingClientRect().bottom - cardTop > slotH - FOOT).length;
    card.classList.toggle("clipped", over);
    const isRaised = over && raised.includes(g);
    card.classList.toggle("raised", isRaised);
    if (isRaised) now.push(g);
    const btn = card.querySelector("[data-showall]");
    if (btn) btn.textContent = hidden ? `Show all · ${hidden} more` : "Show all";
  });
  raised = raised.filter(g => now.includes(g));
  document.querySelectorAll(".slot").forEach(slot => {
    const i = raised.indexOf(slot.dataset.g);
    slot.firstElementChild.style.zIndex = i < 0 ? "" : 10 + i;
  });
}
function raise(g) { raised = raised.filter(x => x !== g); raised.push(g); layout(); }
function collapse(g) { raised = raised.filter(x => x !== g); layout(); }
const INTERACTIVE = "input, select, textarea, button, a";
$("main").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const g = card.parentElement.dataset.g;
  if (e.target.closest("[data-collapse]")) return collapse(g);
  if (e.target.closest("[data-showall]")) return raise(g);
  if (e.target.closest(INTERACTIVE)) { if (raised.includes(g) && raised[raised.length - 1] !== g) raise(g); return; }
  if (card.classList.contains("clipped") || raised.includes(g)) raise(g);
});
$("main").addEventListener("focusin", e => {
  const card = e.target.closest(".card");
  if (!card || card.classList.contains("raised") || !card.classList.contains("clipped")) return;
  const slot = card.parentElement;
  const r = e.target.getBoundingClientRect(), c = card.getBoundingClientRect();
  if (r.bottom > c.top + slot.clientHeight - FOOT) raise(slot.dataset.g);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && raised.length && !document.querySelector(".popover.open")) collapse(raised[raised.length - 1]);
}, true);
document.addEventListener("click", e => {
  if (raised.length && !e.target.closest(".card, .bar, .popover, .chevron, #toast")) { raised = []; layout(); }
});
let layoutQueued = false;
window.addEventListener("resize", () => { if (layoutQueued) return; layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layout(); }); });

function updateNotes() {
  const parts = [];
  const nPending = Object.keys(pendingDriver).length;
  if (device === "keyboard") {
    parts.push("Keyboard settings are applied by the companion while it runs.");
  } else {
    const mode = values["scroll.mode"];
    parts.push(mode === "companion" ? "<b>Scrolling:</b> companion engine. Windows' own scrolling is turned off while the companion runs and turned back on when it exits."
             : mode === "off" ? "<b>Scrolling:</b> off." : "<b>Scrolling:</b> Windows (native).");
    if (values["native.disableMultiFinger"]) parts.push("Windows' own 3/4-finger gestures are off so they don't double-fire; if they still trigger, sign out and back in once.");
    parts.push(nPending ? `<b>${nPending} driver change${nPending > 1 ? "s" : ""} not applied yet.</b>` : "No pending driver changes.");
  }
  $("notes").innerHTML = parts.map(p => `<p>${p}</p>`).join("");
  $("keyflag").classList.toggle("on", nPending > 0 && device === "trackpad");
}

async function save(key, value) {
  const spec = schema.find(s => s.key === key);
  if (spec.backend === "driver") {
    if (value === values[key]) delete pendingDriver[key]; else pendingDriver[key] = value;
    render();
    return;
  }
  const dev = device;
  const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ device: dev, changes: { [key]: value } }) });
  const body = await r.json();
  if (!r.ok) { toast(body.error || "Failed to save"); return; }
  if (dev !== device) { toast(`${spec.label}: saved`); return; } // user switched device while saving
  values = body.values;
  render();
  toast(`${spec.label}: saved`);
}

function readControl(el) {
  const spec = schema.find(s => s.key === el.dataset.key);
  if (spec.kind === "bool") return el.checked;
  if (spec.kind === "choice") return el.value;
  const n = spec.kind === "int" ? parseInt(el.value, 10) : parseFloat(el.value);
  return Number.isFinite(n) ? Math.min(spec.max ?? n, Math.max(spec.min ?? n, n)) : values[spec.key];
}

$("main").addEventListener("change", e => { if (e.target.dataset.key) save(e.target.dataset.key, readControl(e.target)); });
$("main").addEventListener("click", async e => {
  const key = e.target.dataset.reset;
  if (key) return save(key, schema.find(s => s.key === key).default);
  if ("applyDriver" in e.target.dataset) {
    e.target.disabled = true; e.target.textContent = "Waiting for UAC…";
    const r = await fetch("/api/driver/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ changes: pendingDriver }) });
    const body = await r.json();
    if (r.ok) { values = body.values; pendingDriver = {}; toast("Driver settings written. Power-cycle the trackpad to apply."); }
    else toast("Driver settings not written (UAC declined?)");
    render();
  }
});

let loadToken = 0;
async function load() {
  const dev = device, token = ++loadToken;
  const r = await fetch("/api/settings?device=" + encodeURIComponent(dev));
  const body = await r.json();
  if (token !== loadToken) return; // a newer device selection superseded this load
  // The keyboard view shows only keyboard settings; system-wide ones stay in the trackpad view.
  schema = dev === "keyboard" ? body.schema.filter(s => s.device === "keyboard") : body.schema;
  values = body.values;
  SECTIONS = SECTIONS_BY_DEVICE[dev];
  raised = [];
  render();
}

// ---- Device strip: one chip per device, a radiogroup with roving tabindex. ----
let devStatus = {}; // device id -> status item from /api/devices
const statusItem = id => devStatus[id];
function statusText(id) {
  const it = statusItem(id);
  if (!it) return "Not paired";
  if (!it.connected) return "Disconnected";
  const pct = Number.isFinite(it.percent) ? ` · ${it.percent}%` : "";
  return it.transport === "usb" ? "USB-C" : "Bluetooth" + pct;
}
function buildStrip() {
  $("devstrip").innerHTML = DEVICES.map(d => `<button type="button" class="chip" role="radio" data-dev="${d.id}">${d.icon}<span><span class="nm">${d.name}</span><span class="st"></span></span></button>`).join("");
  updateStrip();
}
function updateStrip() {
  DEVICES.forEach((d, i) => {
    const chip = $("devstrip").children[i];
    const on = d.id === device;
    chip.setAttribute("aria-checked", on);
    if (on) chip.setAttribute("aria-current", "true"); else chip.removeAttribute("aria-current");
    chip.tabIndex = on ? 0 : -1;
    chip.classList.toggle("off", !(statusItem(d.id) && statusItem(d.id).connected));
    chip.querySelector(".st").textContent = statusText(d.id);
  });
  const cur = DEVICES.find(d => d.id === device);
  $("devtitle").textContent = " / " + cur.name;
}
function selectDevice(id, focus) {
  if (!DEVICES.some(d => d.id === id)) return;
  const changed = id !== device;
  device = id;
  try { localStorage.setItem("settingsDevice", id); } catch {}
  const url = new URL(location.href);
  url.searchParams.set("device", id);
  history.replaceState(null, "", url);
  updateStrip();
  if (focus) $("devstrip").children[DEVICES.findIndex(d => d.id === id)].focus();
  if (changed) load();
}
$("devstrip").addEventListener("click", e => {
  const chip = e.target.closest("[data-dev]");
  if (chip) selectDevice(chip.dataset.dev, false);
});
$("devstrip").addEventListener("keydown", e => {
  const i = DEVICES.findIndex(d => d.id === device), n = DEVICES.length;
  let j = null;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") j = (i + 1) % n;
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") j = (i - 1 + n) % n;
  else if (e.key === "Home") j = 0;
  else if (e.key === "End") j = n - 1;
  if (j === null) return;
  e.preventDefault();
  selectDevice(DEVICES[j].id, true);
});
function setDevices(list) {
  if (list && !Array.isArray(list)) list = list.devices;
  devStatus = {};
  for (const it of list || []) {
    const d = DEVICES.find(x => x.name === (it.device || it.name));
    if (d) devStatus[d.id] = it;
  }
  updateStrip();
  if (resolveStatus) { resolveStatus(); resolveStatus = null; }
}
let resolveStatus = null;
function watchDevices() {
  const ready = new Promise(res => { resolveStatus = res; });
  if (window.MC && MC.onDevices) {
    MC.onDevices(setDevices);
  } else {
    const poll = () => fetch("/api/devices").then(r => r.json()).then(setDevices).catch(() => {});
    poll();
    setInterval(poll, 3000);
  }
  return ready;
}

async function init() {
  buildStrip();
  const ready = watchDevices();
  let want = new URLSearchParams(location.search).get("device");
  if (!DEVICES.some(d => d.id === want)) { try { want = localStorage.getItem("settingsDevice"); } catch { want = null; } }
  if (!DEVICES.some(d => d.id === want)) {
    await Promise.race([ready, new Promise(res => setTimeout(res, 1500))]);
    const first = DEVICES.find(d => statusItem(d.id) && statusItem(d.id).connected);
    want = first ? first.id : "trackpad";
  }
  device = want;
  selectDevice(want, false);
  load();
}

init();
</script>

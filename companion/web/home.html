<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/common.css">
<style>
  html, body { overflow: hidden; overscroll-behavior: none; }
  body { height: 100dvh; min-height: 0; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  main { flex: 1 1 0; min-height: 0; display: flex; overflow-y: auto; padding: 16px 20px; }

  .gallery { list-style: none; margin: auto 0; width: 100%; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 32px 40px; }
  .dev { flex: 0 1 300px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 16px 14px;
         text-align: center; border-radius: 12px; cursor: pointer; }
  .dev:hover { background: var(--hover); }
  .dev > * { flex: none; }
  .art { width: 220px; height: 150px; max-width: 100%; color: var(--ink); margin-bottom: 8px; }
  .dev.off .art { stroke-dasharray: 4 4; opacity: .4; }
  .dev.off .name { color: var(--muted); }
  .name { margin: 0; font-size: 17px; font-weight: 600; }
  .name a { color: inherit; text-decoration: none; }
  .name a:focus-visible { outline: 1px solid var(--muted); outline-offset: 3px; }
  .conn { margin: 0; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .conn svg { flex: none; }

  .level { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pct { font-size: 34px; line-height: 1; font-weight: 600; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 12px; }
  .dev.off .pct { color: var(--muted); font-weight: 500; }
  .pct.charging { animation: chargePulse 2s ease-in-out infinite; }
  @keyframes chargePulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .pct.charging { animation: none; } }   /* same font/size as not charging; the status line says "charging" */
  .pct.low { color: var(--bad); }

  .batt { width: min(200px, 80%); height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; margin-top: 2px; }
  .batt i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
  .batt.low i { background: var(--bad); }
  .dev.off .batt { background: transparent; border: 1px solid var(--rule); height: 6px; }
  .dev.off .batt i { background: transparent; border: 1px solid var(--muted); border-radius: 2px; }
  .dev.off .batt.low i { border-color: var(--bad); }

  .dtog { margin-top: 8px; padding: 2px 8px; border: 0; background: none; color: var(--muted); font-size: 12px; }
  .dtog:hover, .dtog[aria-expanded=true] { color: var(--ink); }
  .dtog::after { content: " \25BE"; }
  .dtog[aria-expanded=true]::after { content: " \25B4"; }
  .details { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 12px; text-align: left; cursor: default; }
  .details[hidden] { display: none; }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  .empty { margin: auto; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 6px; font-size: 16px; color: var(--ink); }
  .empty a { color: var(--muted); }
  .empty a:hover { color: var(--ink); }
</style>
</head>
<body>
<main>
  <ul class="gallery" id="gallery" aria-label="Apple devices" hidden></ul>
  <div class="empty" id="empty" hidden>
    <p>No Apple devices paired</p>
    <a href="/settings">Open settings</a>
  </div>
</main>
<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = MC.esc;
const gallery = $("gallery");

const svg = body => `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const ICON_BT = svg('<polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/>');
const ICON_USB = svg('<rect x="2.5" y="8" width="19" height="8" rx="4"/><line x1="7" y1="12" x2="17" y2="12"/>');

function ago(t) {
  if (t == null) return "";
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 60) return `${Math.max(1, Math.round(s))} s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
}

const opened = new Set();   // device ids whose Details are expanded; survives rebuilds
let ids = [];

function buildCard(d) {
  const el = document.createElement("li");
  el.className = "dev"; el.dataset.id = d.id;
  el.innerHTML = `<svg class="art ${esc(d.id)}" aria-hidden="true"><use href="/devices.svg#dev-${esc(d.id)}"/></svg>`
    + `<h2 class="name"><a href="/settings?device=${encodeURIComponent(d.id)}"></a></h2><p class="conn"></p>`
    + `<div class="level"><span class="pct"></span><span class="sub"></span></div><div class="batt"><i></i></div>`
    + `<button class="dtog" aria-expanded="false">Details</button>`
    + `<dl class="details" hidden><dt>Address</dt><dd data-k="address"></dd><dt>Serial</dt><dd data-k="serial"></dd><dt>Firmware</dt><dd data-k="firmware"></dd></dl>`;
  const btn = el.querySelector(".dtog"), dl = el.querySelector(".details");
  btn.onclick = () => {
    const on = dl.hidden;
    dl.hidden = !on; btn.setAttribute("aria-expanded", on ? "true" : "false");
    on ? opened.add(d.id) : opened.delete(d.id);
  };
  if (opened.has(d.id)) { dl.hidden = false; btn.setAttribute("aria-expanded", "true"); }
  el.addEventListener("click", e => {
    if (e.target.closest(".dtog, .details, a") || getSelection().toString()) return;
    location.href = `/settings?device=${encodeURIComponent(d.id)}`;
  });
  return el;
}

function fill(el, d) {
  const off = !d.connected, usb = d.transport === "usb", known = d.percent != null;
  const low = known && d.percent <= 20;
  el.classList.toggle("off", off);
  el.querySelector(".name a").textContent = d.name || d.device;
  const seen = ago(d.lastSeen ?? d.read_at);
  el.querySelector(".conn").innerHTML = off
    ? `Disconnected${seen ? ` · last seen ${esc(seen)}` : ""}`
    : `${usb ? ICON_USB : ICON_BT}${usb ? "USB-C" : "Bluetooth"}`;
  const pct = el.querySelector(".pct"), sub = el.querySelector(".sub");
  pct.textContent = known ? `${d.percent}%` : off || usb ? "–" : "…";
  pct.classList.toggle("low", low);
  // MC.setCharging lets a running pulse finish its cycle (back at full opacity) before stopping, so it never jumps.
  MC.setCharging(pct, !off && d.charging && known);
  pct.setAttribute("aria-label", known ? `${d.percent} percent${!off && d.charging ? ", charging" : ""}` : "battery level unknown");
  // One format for every state: "<charging|discharging> · synced <age>" (a disconnected card shows its last known state).
  const state = d.charging || (!off && usb) ? "charging" : "discharging";
  sub.textContent = !known ? (off ? "" : "reading…") : `${state}${d.read_at ? ` · synced ${ago(d.read_at)}` : ""}`;
  const bar = el.querySelector(".batt");
  bar.classList.toggle("low", low);
  bar.firstElementChild.style.width = known ? `${Math.max(0, Math.min(100, d.percent))}%` : "0";
  for (const dd of el.querySelectorAll("[data-k]")) dd.textContent = d[dd.dataset.k] || "–";
}

function sortDevices(list) {
  return list.map((d, i) => [d, i]).sort((a, b) => (b[0].connected - a[0].connected) || (a[1] - b[1])).map(x => x[0]);
}

function render(list) {
  list = sortDevices(list || []);
  gallery.hidden = !list.length;
  $("empty").hidden = !!list.length;
  if (!list.length) { ids = []; gallery.replaceChildren(); return; }
  if (list.map(d => d.id).join() !== ids.join()) {
    ids = list.map(d => d.id);
    gallery.replaceChildren(...list.map(buildCard));
  }
  list.forEach((d, i) => fill(gallery.children[i], d));
}

MC.onDevices(render);
</script>
</body>
</html>

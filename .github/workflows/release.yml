name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Read version and check the tag matches
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path companion/version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match companion/version.py ($v)"
          }

      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe, portable zip and installer
        shell: pwsh
        working-directory: companion/packaging
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          python -m PyInstaller MagicCompanion.spec --noconfirm --distpath dist --workpath build
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          Compress-Archive -Path dist/MagicCompanion -DestinationPath "dist/MagicCompanion-${{ steps.version.outputs.version }}-portable.zip"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" MagicCompanion.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            companion/packaging/dist/MagicCompanion-Setup-${{ steps.version.outputs.version }}.exe
            companion/packaging/dist/MagicCompanion-${{ steps.version.outputs.version }}-portable.zip

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: MagicCompanion
          path: |
            companion/packaging/dist/MagicCompanion-Setup-*.exe
            companion/packaging/dist/MagicCompanion-*-portable.zip
